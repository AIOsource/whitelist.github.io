<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHITELIST VPN</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #777777;
      --border: #333333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    header {
      text-align: left;
      margin-bottom: 60px;
      border-left: 4px solid var(--fg);
      padding-left: 20px;
    }

    h1 {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: uppercase;
      line-height: 0.9;
    }

    .subtitle {
      font-size: 12px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-top: 8px;
    }

    .card {
      background: #000;
      border: 1px solid var(--border);
      padding: 30px;
      margin-bottom: 20px;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
      margin-bottom: 15px;
      display: block;
    }

    .copy-box {
      display: flex;
      border: 1px solid var(--fg);
      padding: 4px;
    }

    #sub-url {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg);
      padding: 12px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }

    .copy-btn {
      background: var(--fg);
      color: var(--bg);
      border: none;
      padding: 0 25px;
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--dim);
      color: var(--fg);
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 30px;
    }

    .node {
      border: 1px solid var(--border);
      padding: 15px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .node:hover {
      border-color: var(--fg);
    }

    .node span { font-size: 13px; font-weight: 500; }
    .node .flag { font-size: 18px; filter: grayscale(1); opacity: 0.7; }

    .instructions {
      margin-top: 40px;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.6;
    }

    .step {
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
    }

    .step-num {
      color: var(--fg);
      font-weight: 900;
    }

    footer {
      margin-top: 60px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--dim);
      text-transform: uppercase;
      text-align: center;
    }

    /* Selection Color */
    ::selection {
      background: var(--fg);
      color: var(--bg);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Whitelist</h1>
      <div class="subtitle">Secure Network / 2026</div>
    </header>

    <div class="card">
      <span class="label">Subscription URL</span>
      <div class="copy-box">
        <input type="text" id="sub-url" readonly value="https://aiosource.github.io/whitelist.github.io/sub.json">
        <button class="copy-btn" id="copy-btn" onclick="copy()">Copy</button>
      </div>

      <div class="nodes-grid">
        <div class="node"><span>Poland</span> <span class="flag">🇵🇱</span></div>
        <div class="node"><span>Finland</span> <span class="flag">🇫🇮</span></div>
        <div class="node"><span>Russia</span> <span class="flag">🇷🇺</span></div>
        <div class="node"><span>Netherlands</span> <span class="flag">🇳🇱</span></div>
        <div class="node"><span>Germany</span> <span class="flag">🇩🇪</span></div>
        <div class="node"><span>USA</span> <span class="flag">🇺🇸</span></div>
      </div>
    </div>

    <div class="instructions">
      <div class="step">
        <span class="step-num">01</span>
        <span>Copy the subscription link provided above.</span>
      </div>
      <div class="step">
        <span class="step-num">02</span>
        <span>Open your VPN client (Hiddify / Happ / v2ray).</span>
      </div>
      <div class="step">
        <span class="step-num">03</span>
        <span>Import from clipboard and update nodes.</span>
      </div>
    </div>

    <footer>
      &copy; WHITELIST VPN / ALL RIGHTS RESERVED
    </footer>
  </div>

  <script>
    function copy() {
      const input = document.getElementById('sub-url');
      const btn = document.getElementById('copy-btn');
      
      navigator.clipboard.writeText(input.value).then(() => {
        const originalText = btn.innerText;
        btn.innerText = 'Copied';
        setTimeout(() => {
          btn.innerText = originalText;
        }, 2000);
      });
    }
  </script>
</body>
</html>
